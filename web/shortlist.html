<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shortlist — M&amp;A Screener</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body data-page="shortlist">

<div id="nav-placeholder"></div>

<main>
    <section class="section" style="margin-top:24px;">
        <h2>Top-Ranked Companies</h2>
        <p class="section-caption">Sector-relative composite score across valuation, quality, leverage, and growth.</p>

        <div class="pill-group" id="shortlist-sector-pills"></div>

        <div class="control-row">
            <div class="control">
                <label for="shortlist-top-n">Show top N &nbsp;<span class="control-value" id="shortlist-top-n-value">10</span></label>
                <input type="range" id="shortlist-top-n" min="5" max="50" value="10">
            </div>
        </div>

        <div class="table-wrap"><div id="shortlist-table" class="loading">Loading&hellip;</div></div>
        <div id="shortlist-explanations"></div>
    </section>
</main>

<footer>
    <p>Generated by the M&amp;A Screener project. Not investment advice &mdash; see README for full methodology and limitations.</p>
</footer>

<script src="/app.js"></script>
</body>
</html>
