# M&A Screener — universe and settings config
# Edit this file to change what the screener covers. No code changes needed.
#
# Universe expanded from 16 (cement + IT only) to ~200 tickers across 16
# sectors. A handful of tickers may fail to resolve via yfinance (renamed,
# delisted, or restructured entities) — this is expected and handled
# gracefully by the pipeline: excluded cleanly with a logged reason, not
# a crash. Check data/processed/cleaning_flags.csv after a run to see
# exactly which ones, if any, and prune them from this list if they're
# persistently broken rather than transient.

