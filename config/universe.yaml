data:
  lookback_years: 5          # historical financials window
  cache_dir: "data/raw"
  cache_expiry_days: 1       # refetch if cache older than this
  request_delay_seconds: 0.4 # politeness delay between successful fetches — at 200 tickers, hitting yfinance without any pacing meaningfully increases rate-limit failures

scoring:
  weights:
    valuation: 0.30
    quality: 0.30
    leverage: 0.20
    growth: 0.20

output:
  results_dir: "data/processed"
  top_n_shortlist: 10
